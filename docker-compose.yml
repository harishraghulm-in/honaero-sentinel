version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: sentinel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sentinel_db
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: sentinel-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://sentinel:sentinel_secret@postgres:5432/sentinel_db
      APP_ENV: production
      LOG_LEVEL: INFO
      EXECUTION_ENGINE: local_process
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./storage:/app/storage
      - ./workspaces:/app/workspaces

volumes:
  postgres_data:

